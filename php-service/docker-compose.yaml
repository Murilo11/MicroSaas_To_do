services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: micro-app
    volumes:
    - .:/var/www

    networks:
      - microsaas-net

  # Nginx Server
  webserver:
    image: nginx:alpine
    container_name: micro-webserver
    ports:
      - "8081:80"
    volumes:
       - .:/var/www/html
       - ./docker-config/nginx:/etc/nginx/conf.d
    networks:
      - microsaas-net

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: micro-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: microsaas
      MYSQL_ROOT_PASSWORD: root
    networks:
      - microsaas-net

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: micro-rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    networks:
      - microsaas-net

  redis:
    image: redis:7-alpine
    container_name: cqrs_redis
    command: redis-server --requirepass admin123
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - microsaas-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
    redisdata:

networks:
  microsaas-net:
    external: true